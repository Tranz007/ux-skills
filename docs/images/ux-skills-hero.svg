<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="682" viewBox="0 0 2048 682" role="img" aria-labelledby="title desc">
<title id="title">UX Skills hero banner</title>
<desc id="desc">UX Skills, your UX thinking partner for the AI era. A layered diagram connects people, insights, experiences, and outcomes to better users, clearer decisions, stronger experiences, and real impact.</desc>
<defs>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63e8e0"/><stop offset="1" stop-color="#10b8be"/></linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#116d72"/><stop offset="1" stop-color="#063c45"/></linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7e8"/><stop offset="1" stop-color="#f9e4bd"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".94"/><stop offset="1" stop-color="#eaf3f5" stop-opacity=".7"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14323a" flood-opacity=".14"/></filter>
</defs>
<rect width="2048" height="682" fill="#fbfaf6"/>
<circle cx="855" cy="-20" r="108" fill="#ffd875" opacity=".46"/>
<path d="M0 302 C180 310 250 395 360 540 C245 500 154 470 0 474Z" fill="#dff3ef"/>
<path d="M0 475 C88 464 173 519 229 682 H0Z" fill="#1c686d" opacity=".95"/>
<path d="M1576 682 C1655 585 1757 526 1905 515 C1978 512 2037 536 2048 545 V682Z" fill="#eef4f1"/>

<!-- wordmark -->
<g transform="translate(152 182)">
  <text x="0" y="152" font-family="Inter,Arial,sans-serif" font-size="170" font-weight="800" letter-spacing="-8" fill="#17232c">UX</text>
  <polygon points="344,0 408,0 384,54" fill="#1fc3b3"/>
  <text x="390" y="152" font-family="Inter,Arial,sans-serif" font-size="142" font-weight="400" letter-spacing="-7" fill="#17232c">Skills</text>
  <text x="7" y="218" font-family="Inter,Arial,sans-serif" font-size="47" font-weight="400" fill="#5f6b73">Your UX thinking partner for the AI era.</text>
  <g font-family="Inter,Arial,sans-serif" font-size="24" font-weight="500" letter-spacing="4" fill="#303c45">
    <text x="7" y="286">UNDERSTAND</text><circle cx="235" cy="278" r="6" fill="#15bdb1"/>
    <text x="280" y="286">EXPLORE</text><circle cx="441" cy="278" r="6" fill="#ff8a4b"/>
    <text x="486" y="286">IMPROVE</text><circle cx="648" cy="278" r="6" fill="#f1b829"/>
    <text x="693" y="286">BUILD</text>
  </g>
</g>

<!-- layered model -->
<g filter="url(#shadow)" transform="translate(1110 66)">
  <g transform="skewX(-16)">
    <rect x="150" y="0" width="420" height="156" rx="18" fill="url(#glass)" stroke="#dfe8ea"/>
    <rect x="105" y="130" width="420" height="156" rx="18" fill="url(#cream)" stroke="#f5d8aa"/>
    <rect x="58" y="260" width="420" height="156" rx="18" fill="url(#teal)" opacity=".78" stroke="#7ee7e1"/>
    <rect x="8" y="390" width="420" height="156" rx="18" fill="url(#deep)" stroke="#0e6b70"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" fill="#25313a">
    <circle cx="360" cy="76" r="15" fill="#99a6ab"/><path d="M335 118c8-20 42-20 50 0v11h-50z" fill="#99a6ab"/><text x="360" y="145" font-size="19" letter-spacing="5">PEOPLE</text>
    <circle cx="315" cy="207" r="24" fill="none" stroke="#6e7068" stroke-width="5"/><path d="M306 211l17-12-7 19z" fill="#6e7068"/><text x="315" y="251" font-size="19" letter-spacing="5">INSIGHTS</text>
    <g transform="translate(246 330)" fill="#145b60"><rect x="0" y="0" width="17" height="17" rx="2"/><rect x="24" y="0" width="17" height="17" rx="2"/><rect x="0" y="24" width="17" height="17" rx="2"/><rect x="24" y="24" width="17" height="17" rx="2"/></g>
    <text x="267" y="394" font-size="18" letter-spacing="5">EXPERIENCES</text>
    <text x="220" y="490" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="48" font-weight="700" fill="#79e9e3">&lt;/&gt;</text>
    <text x="220" y="530" font-size="18" letter-spacing="5" fill="#e7f8f5">OUTCOMES</text>
  </g>
</g>

<!-- connectors and outcomes -->
<g fill="none" stroke-width="2">
  <path d="M1515 145 H1650 Q1683 145 1683 112 V94 H1758" stroke="#20c5bb"/>
  <path d="M1475 276 H1650 Q1692 276 1692 239 V223 H1758" stroke="#ff8d57"/>
  <path d="M1429 407 H1658 Q1700 407 1700 369 V351 H1758" stroke="#efba28"/>
  <path d="M1380 538 H1668 Q1711 538 1711 500 V480 H1758" stroke="#1b7479"/>
</g>
<g font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="5" fill="#26343d">
  <circle cx="1758" cy="94" r="7" fill="#20c5bb"/><text x="1790" y="87">BETTER</text><text x="1790" y="115">USERS</text>
  <circle cx="1758" cy="223" r="7" fill="#ff8d57"/><text x="1790" y="216">CLEARER</text><text x="1790" y="244">DECISIONS</text>
  <circle cx="1758" cy="351" r="7" fill="#efba28"/><text x="1790" y="344">STRONGER</text><text x="1790" y="372">EXPERIENCES</text>
  <circle cx="1758" cy="480" r="7" fill="#1b7479"/><text x="1790" y="473">REAL</text><text x="1790" y="501">IMPACT</text>
</g>
</svg>